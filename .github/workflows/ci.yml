name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  # Pull requests: one run per branch, newest wins. Pushes: one run per
  # commit, nothing cancelled — a commit with no verdict is a hole nobody
  # comes back to fill.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  vectors:
    name: Vector drift guard
    runs-on: ubuntu-latest
    steps:

      - name: Checkout (no submodules needed)
        uses: actions/checkout@v4

      # Re-derives the hand-cross-validated anchors and fails when the
      # committed JSON differs from what the generator emits.
      - name: Verify anchors and generated vector files
        run: python3 tools/generate-test-vectors.py --check

  csharp:
    name: "C# harness: Hermod (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    # Both platforms Hermod is developed on; fail-fast off so that
    # "red on exactly one platform" — the most valuable signal a matrix
    # produces — is never cancelled by the other leg.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Tests/TOTPConformance_Tests/TOTPConformance_Tests.csproj -c Release

  typescript:
    name: "TS harness: TOTP.ts (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm --prefix Tests/TOTPConformance_Tests.TS install

      - name: Test
        run: npm --prefix Tests/TOTPConformance_Tests.TS test
